name: complete-sprite-critter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append MagicalAccents and clean up
        run: |
          python3 << 'PY'
          from pathlib import Path
          main = Path("src/components/sprite-critter.tsx")
          tail = Path("src/components/sprite-critter.tail.txt")
          text = main.read_text()
          if "function MagicalAccents" not in text and tail.exists():
              main.write_text(text + tail.read_text())
          if tail.exists():
              tail.unlink()
          wf = Path(".github/workflows/complete-sprite-critter.yml")
          if wf.exists():
              wf.unlink()
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Complete sprite-critter after truncated upload."
          git push
