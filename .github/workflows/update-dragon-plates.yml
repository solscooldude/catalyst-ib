name: update-dragon-plates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-dragon-plates.yml"
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch DragonSpikes and clean up
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/sprite-critter.tsx")
          text = p.read_text()
          old_plates_grown = """        [50, 17.6, 3.15, 0],
          [54.4, 27.2, 2.75, 16],
          [59.8, 40.4, 2.55, 22],
          [65.2, 55.2, 2.35, 26],
          [70.6, 68.6, 2.15, 30],
          [76.4, 76.8, 1.95, 18],
          [82.2, 73.4, 1.7, -8],
          [87.2, 68.2, 1.45, -18],"""
          new_plates_grown = """        [50, 15.4, 4.4, 0],
          [55.6, 25.8, 3.8, 18],
          [61.2, 39.2, 3.5, 24],
          [66.8, 53.8, 3.2, 28],
          [72.2, 67.4, 2.9, 30],
          [78.2, 76.2, 2.55, 16],
          [84.2, 73.6, 2.2, -10],
          [89.4, 68.4, 1.85, -20],"""
          old_plates_small = """        [50, 18.4, 2.75, 0],
          [54.6, 28.6, 2.4, 16],
          [60.4, 43.2, 2.2, 22],
          [66.2, 58.4, 2.05, 26],
          [72.4, 72.2, 1.85, 24],
          [79.2, 77.2, 1.65, 8],
          [85.2, 71.4, 1.4, -16],"""
          new_plates_small = """        [50, 16.2, 3.9, 0],
          [55.8, 27.2, 3.35, 18],
          [61.8, 41.6, 3.1, 24],
          [67.6, 56.8, 2.8, 28],
          [73.8, 70.8, 2.5, 26],
          [80.6, 76.8, 2.2, 8],
          [86.8, 71.2, 1.85, -16],"""
          # The triple-quoted blocks above were indented by the YAML heredoc.
          # Dedent them to the exact file indentation (8 spaces).
          import textwrap
          old_plates_grown = textwrap.dedent(old_plates_grown)
          new_plates_grown = textwrap.dedent(new_plates_grown)
          old_plates_small = textwrap.dedent(old_plates_small)
          new_plates_small = textwrap.dedent(new_plates_small)
          if old_plates_grown not in text or old_plates_small not in text:
              raise SystemExit("plate blocks not found")
          text = text.replace(old_plates_grown, new_plates_grown, 1)
          text = text.replace(old_plates_small, new_plates_small, 1)
          old_fill = "          fill={palette.furDeep}"
          new_fill = '          fill="#4E663C"'
          if text.count(old_fill) != 1:
              raise SystemExit(f"fill count {text.count(old_fill)}")
          text = text.replace(old_fill, new_fill, 1)
          p.write_text(text)
          wf = Path(".github/workflows/update-dragon-plates.yml")
          if wf.exists():
              wf.unlink()
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Make dragon dorsal plates larger and easier to read."
          git push
