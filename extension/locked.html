<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locked · Catalyst</title>
    <link rel="stylesheet" href="locked.css" />
  </head>
  <body>
    <main class="card">
      <p class="kicker">Lock hours</p>
      <h1 id="title">This site is locked</h1>
      <p id="copy" class="copy">
        Distracting sites stay closed during your study window. School tools
        such as Docs stay open.
      </p>
      <p id="detail" class="detail"></p>
      <a id="unlock" class="button" href="https://catalyst-study.vercel.app/unlocks">
        Spend tokens on Catalyst
      </a>
      <p class="hint">
        Unlock Tier 2, Tier 3, or a nemesis in the Catalyst tab. The extension
        reads that timer and lets the site through until it ends.
      </p>
    </main>
    <script src="locked.js" type="module"></script>
  </body>
</html>
