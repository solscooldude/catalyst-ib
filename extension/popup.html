<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalyst Lock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="kicker">Catalyst Lock</p>
      <div class="toggle-row">
        <p id="status" class="status unknown">Unknown</p>
        <button
          type="button"
          id="toggle"
          class="toggle"
          role="switch"
          aria-checked="false"
          aria-label="Catalyst Lock on or off"
        >
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-knob"></span>
          </span>
        </button>
      </div>
      <p id="status-detail" class="muted">Reading policy…</p>
      <p id="toggle-hint" class="hint">Open Catalyst so lock hours can sync.</p>
    </header>

    <section>
      <h2>Hours</h2>
      <p id="hours" class="body">No schedule synced — open Catalyst</p>
    </section>

    <section>
      <h2>Sync</h2>
      <p id="sync" class="body">Not synced — open Catalyst</p>
    </section>

    <section>
      <h2>Unlocks</h2>
      <p id="unlocks" class="body">None</p>
    </section>

    <a id="open" class="button" href="https://catalyst-study.vercel.app">
      Open Catalyst
    </a>
    <p class="hint">Keep Catalyst open so unlocks stay in sync</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
